<style>
:root{
  --bg:#f5f1e7; --panel:#fffdf8; --panel2:#f9f5ec; --line:#e3dccd;
  --tx:#2b2822; --tx2:#6d6659; --tx3:#9d9486;
  --cy:#0e7f9c; --gn:#1c8a5c; --am:#b0741c; --rd:#c1473e; --pu:#7b4fd0;
  --mono:"Consolas","ui-monospace","SF Mono",monospace;
  --ac:var(--rd); --acsoft:rgba(193,71,62,.1); --acline:rgba(193,71,62,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background-image:radial-gradient(ellipse 900px 480px at 50% -90px,rgba(193,71,62,.06),transparent)}
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 70px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar .back{color:var(--tx2);text-decoration:none;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;transition:all .15s}
.topbar .back:hover{color:var(--rd);border-color:var(--acline)}
.topbar h1{font-size:21px;letter-spacing:1px}
.topbar h1 .no{font-family:var(--mono);font-size:12px;color:var(--ac);border:1px solid var(--acline);border-radius:6px;padding:2px 8px;margin-right:10px;vertical-align:3px}
.topbar .claim{margin-left:auto;font-size:12px;color:var(--tx2);font-family:var(--mono)}
.tabs{display:flex;gap:10px;margin-bottom:20px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 82%,transparent);padding:8px 0}
.tab{flex:1;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:11px 16px;background:var(--panel);transition:all .18s;text-align:left}
.tab .tn{font-family:var(--mono);font-size:10.5px;color:var(--tx3);display:block;margin-bottom:3px}
.tab .tt{font-size:14.5px;font-weight:700;color:var(--tx2)}
.tab .td{font-size:11px;color:var(--tx3);margin-top:2px}
.tab:hover{border-color:#2c3849}
.tab.on{border-color:var(--acline);background:linear-gradient(180deg,var(--acsoft),var(--panel))}
.tab.on .tt{color:var(--tx)} .tab.on .tn{color:var(--ac)}
.layer{display:none;animation:fadein .3s ease}
.layer.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;letter-spacing:.5px}
.card h3 .hl{color:var(--rd)}
.card p{font-size:13px;line-height:1.85;color:var(--tx2)}
.card p b{color:var(--tx)}
/* 网格 */
.grids{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.gwrap{text-align:center}
.gwrap .gl{font-size:11.5px;color:var(--tx2);margin-bottom:8px}
.gwrap svg{background:#fbf7ee;border:1px solid var(--line);border-radius:9px}
.verdict{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px;margin-top:14px;justify-content:center}
.lamp{width:11px;height:11px;border-radius:50%;background:#2c3849;flex:none}
.lamp.g{background:var(--gn);box-shadow:0 0 10px var(--gn)}
.lamp.a{background:var(--am);box-shadow:0 0 10px var(--am)}
.lamp.r{background:var(--rd);box-shadow:0 0 10px var(--rd)}
.nextbtn{cursor:pointer;border:1px solid var(--acline);background:var(--acsoft);color:var(--ac);border-radius:9px;padding:10px 20px;font-size:13.5px;font-family:inherit;transition:all .15s}
.nextbtn:hover{background:rgba(193,71,62,.2);box-shadow:0 0 16px rgba(193,71,62,.25)}
.nextbtn.ghost{border-color:var(--line);background:transparent;color:var(--tx2)}
.nextbtn.ghost:hover{color:var(--tx);box-shadow:none}
.tctrl{display:flex;gap:10px;flex-wrap:wrap}
/* 玩具 */
.toy{display:grid;grid-template-columns:330px 1fr;gap:16px}
@media(max-width:900px){.toy{grid-template-columns:1fr}}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:13px}
.row label{color:var(--tx2);white-space:nowrap;min-width:78px}
.row output{font-family:var(--mono);color:var(--ac);min-width:52px;text-align:right}
input[type=range]{flex:1;appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--fill,50%),#232c3a var(--fill,50%));outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#ffecec;border:2px solid var(--ac);cursor:pointer;box-shadow:0 0 8px rgba(193,71,62,.5)}
select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--tx);padding:8px 10px;font-size:12.5px;outline:none;font-family:inherit}
.dpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dpick button{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--tx2);font-family:var(--mono);font-size:14px;cursor:pointer;transition:all .15s;padding:0}
.dpick button:hover{border-color:#2c3849;color:var(--tx)}
.dpick button.on{border-color:var(--acline);color:var(--ac);background:var(--acsoft);box-shadow:0 0 10px rgba(193,71,62,.2)}
/* 置信度双条 */
.pairs{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.pair{display:grid;grid-template-columns:20px 1fr 1fr 58px;align-items:center;gap:8px;font-family:var(--mono);font-size:11px}
.pair .d{color:var(--tx2);text-align:center}
.pair .pb{height:9px;border-radius:3px;background:#e3dccd;overflow:hidden;position:relative}
.pair .pb i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .2s}
.pair .pb.before i{background:#31435f}
.pair .pb.after i{background:linear-gradient(90deg,#8a3038,var(--rd))}
.pair .pvl{color:var(--tx3);text-align:right;white-space:nowrap}
.pair .pvl b{color:var(--tx)}
.pair.isTop .pvl b{color:var(--rd)}
.legend{font-size:11px;color:var(--tx3);display:flex;gap:16px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* 硬核 */
.hard2{display:grid;grid-template-columns:290px 1fr;gap:16px}
@media(max-width:900px){.hard2{grid-template-columns:1fr}}
.metric{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--tx2);padding:7px 0;border-bottom:1px dashed var(--line)}
.metric:last-child{border:none}
.metric b{font-family:var(--mono);font-size:14px;color:var(--tx)}
.fliptbl{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;font-family:var(--mono);font-size:11px;color:var(--tx2)}
.fliptbl div{display:flex;justify-content:space-between;border-bottom:1px dashed #e3dccd;padding:2px 0}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:9px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:9px;padding:11px 15px;font-size:13px;font-family:inherit;transition:all .15s}
.quiz .opt:hover{border-color:var(--acline)}
.quiz .opt.ok{border-color:var(--gn);background:rgba(28,138,92,.1);color:var(--gn)}
.quiz .opt.bad{border-color:var(--rd);background:rgba(193,71,62,.08);color:var(--rd);opacity:.8}
.quiz .res{margin-top:12px;font-size:13px;display:none;align-items:center;gap:10px}
.quiz .res.on{display:flex}
.confetti{position:relative;height:0}
.confetti i{position:absolute;width:7px;height:7px;border-radius:2px;opacity:0;animation:burst 1s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(240deg)}}
footer{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:11.5px;color:var(--tx3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--tx2);text-decoration:none;border-bottom:1px dashed var(--tx3)}
footer a:hover{color:var(--cy)}
</style>
