<style>
:root{
  --bg:#f5f1e7; --panel:#fffdf8; --panel2:#f9f5ec; --line:#e3dccd;
  --tx:#2b2822; --tx2:#6d6659; --tx3:#9d9486;
  --cy:#0e7f9c; --gn:#1c8a5c; --am:#b0741c; --rd:#c1473e; --pu:#7b4fd0;
  --mono:"Consolas","ui-monospace","SF Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background-image:radial-gradient(ellipse 1100px 620px at 50% -120px,rgba(14,127,156,.09),transparent 70%),radial-gradient(ellipse 900px 500px at 50% 118%,rgba(176,116,28,.07),transparent 70%)}
.app{height:100dvh;display:grid;grid-template-rows:56px 1fr 40px;overflow:hidden}
/* ============ 顶栏 ============ */
.bar{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.84);backdrop-filter:blur(10px);z-index:30;box-shadow:0 1px 0 rgba(120,105,80,.06)}
.bar .logo{font-size:16px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.bar .logo em{font-style:normal;color:var(--cy)}
.bar .spacer{flex:1}
.mdash{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.mdash b{font-family:var(--mono);font-size:13px}
.mdash span{font-size:10.5px;color:var(--tx2)}
.barbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:8px;padding:6px 12px;font-size:12px;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.barbtn:hover{color:var(--tx);border-color:#cbbfa9;background:#fffdf8}
.barbtn kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--tx3)}
/* ============ 主舞台 ============ */
.main{display:grid;grid-template-columns:1fr 330px;min-height:0}
.stage{position:relative;overflow:hidden;perspective:1100px}
/* 聚光灯：跟随鼠标 */
.spot{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(560px 420px at var(--sx,50%) var(--sy,40%),rgba(255,236,186,.30),transparent 62%)}
.vig{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse 130% 110% at 50% 45%,transparent 58%,rgba(122,108,84,.12))}
.floor{position:absolute;left:-10%;right:-10%;bottom:0;height:38%;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(14,127,156,.05) 30%,rgba(14,127,156,.09));
  transform:rotateX(58deg);transform-origin:bottom}
.doors{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7%;z-index:10;transform-style:preserve-3d}
.doorcol{display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer}
.door{width:198px;height:330px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-origin:left center}
.door .leaf{position:absolute;inset:0;border-radius:10px 10px 4px 4px;border:1px solid #d9cebb;
  background:linear-gradient(105deg,#fffdf7 0%,#f7efe0 55%,#ece0c9 100%);box-shadow:0 22px 44px -20px rgba(120,100,66,.45);overflow:hidden;transition:box-shadow .4s}
.door .leaf::before{content:"";position:absolute;inset:10px;border:1px solid rgba(158,134,92,.22);border-radius:6px}
.door .leaf::after{content:"";position:absolute;top:10px;bottom:10px;left:34%;width:3px;background:linear-gradient(180deg,transparent,rgba(176,116,28,.34),transparent)}
.door .plate{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--pc,#57c7ff);border:1px solid var(--pc,#0e7f9c);border-radius:5px;padding:3px 10px;background:rgba(255,255,255,.78)}
.door .zname{position:absolute;top:96px;width:100%;text-align:center;font-size:19px;font-weight:800;letter-spacing:6px;writing-mode:vertical-rl;color:#33302a;text-shadow:0 1px 0 rgba(255,255,255,.85)}
.door .zq{position:absolute;bottom:56px;width:100%;text-align:center;font-size:11px;color:var(--tx2);padding:0 14px;writing-mode:horizontal-tb}
.door .glow{position:absolute;inset:0;opacity:0;transition:opacity .5s;background:radial-gradient(70% 45% at 50% 68%,var(--pc-soft,rgba(87,199,255,.25)),transparent 70%)}
.doorcol:hover .door{transform:rotateY(-22deg) translateX(10px)}
.doorcol:hover .glow{opacity:1}
.doorcol:hover .leaf{box-shadow:0 24px 60px -12px var(--pc-soft,rgba(87,199,255,.35))}
.door.open{transform:rotateY(-74deg)}
.door.open .glow{opacity:1}
.dcount{font-size:11.5px;color:var(--tx3);font-family:var(--mono)}
.dcount b{color:var(--tx)}
/* 地面进度线 */
.progressline{position:absolute;left:8%;right:8%;bottom:26px;z-index:9;display:flex;align-items:center;gap:0}
.pl-node{width:12px;height:12px;border-radius:50%;border:2px solid #cbbfa9;background:var(--panel);flex:none;transition:all .4s}
.pl-node.got{border-color:var(--gn);background:var(--gn);box-shadow:0 0 10px var(--gn)}
.pl-seg{flex:1;height:2px;background:#e2dac9}
.pl-seg.got{background:linear-gradient(90deg,var(--gn),var(--gn))}
/* 墙上的 plaque（元骗局） */
.plaque{position:absolute;top:26px;left:30px;z-index:8;max-width:300px;border:1px solid rgba(28,138,92,.30);background:rgba(28,138,92,.06);border-radius:10px;padding:10px 14px;font-size:11px;color:var(--tx2);line-height:1.7;cursor:pointer;transition:all .5s;backdrop-filter:blur(8px)}
.plaque b{color:var(--tx)}
.plaque .seal{display:inline-block;font-family:var(--mono);font-size:9px;color:var(--gn);border:1px solid var(--gn);border-radius:4px;padding:0 5px;margin-left:4px}
.plaque.cracked{border-color:rgba(193,71,62,.45);background:rgba(193,71,62,.07)}
.plaque.cracked .seal{border-color:var(--rd);color:var(--rd);text-decoration:line-through}
.plaque .rev{display:none;margin-top:6px;color:var(--rd)}
.plaque.cracked .rev{display:block}
/* ============ 右栏 ============ */
.side{border-left:1px solid var(--line);background:rgba(255,253,248,.86);backdrop-filter:blur(10px);display:flex;flex-direction:column;min-height:0;z-index:20}
.guide{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.guide .gh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.guide .face{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fff8ea,#f2e6cf);border:1px solid #ddd0b6;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;box-shadow:inset 0 1px 0 #fff}
.guide .who{font-size:11px;color:var(--pu);font-family:var(--mono)}
.guide .say{font-size:12.5px;line-height:1.8;color:var(--tx);min-height:78px}
.guide .say .caret{display:inline-block;width:7px;height:13px;background:var(--pu);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.shelfsec{padding:14px 18px;border-bottom:1px solid var(--line);flex:1;display:flex;flex-direction:column;min-height:0}
.shelfsec .ssh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.shelfsec .ssh h3{font-size:13.5px;letter-spacing:1px}
.shelfsec .ssh span{font-size:10.5px;color:var(--tx3);font-family:var(--mono)}
.shelfsec .ssh #achN{cursor:pointer;color:var(--am);transition:color .2s}
.shelfsec .ssh #achN:hover{color:var(--tx)}
.shelf{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:end;perspective:700px;overflow:hidden;padding:8px 2px 14px;border-radius:10px;background:linear-gradient(180deg,transparent 70%,rgba(14,127,156,.05));position:relative}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:8px;background:linear-gradient(180deg,#e9e0cd,#d8cdb6);border-radius:3px}
.scard{width:auto;height:74px;border-radius:7px;border:1px solid var(--line);background:linear-gradient(160deg,#fffdf8,#f4eee2);position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,1.4,.6,1)}
.scard:hover{transform:translateY(-8px) rotateX(12deg)}
.scard .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:7px;backface-visibility:hidden;padding:4px;text-align:center}
.scard .qm{font-size:20px;color:var(--tx3)}
.scard .nm{font-size:8.5px;color:var(--tx3);line-height:1.3}
.scard.got{border-color:rgba(14,127,156,.45);background:linear-gradient(160deg,#eefafd,#e2f2f6);box-shadow:0 6px 18px -8px rgba(14,127,156,.35)}
.scard.got .qm{font-size:22px}
.scard.got .nm{color:var(--cy)}
.scard.flip .in{transform:rotateY(180deg)}
.scard .back{position:absolute;inset:0;border-radius:7px;background:linear-gradient(160deg,#fbf7ee,#f0e9dc);border:1px solid rgba(14,127,156,.28);transform:rotateY(180deg);backface-visibility:hidden;padding:6px;font-size:8px;line-height:1.5;color:var(--tx2);overflow:hidden}
.scard .back b{color:var(--tx);font-size:8.5px}
.dashsec{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
.ring{width:52px;height:52px;flex:none}
.dashsec .dt{flex:1;font-size:11px;color:var(--tx2);line-height:1.6}
.dashsec .dt b{display:block;font-family:var(--mono);font-size:15px;color:var(--tx)}
.certbtn{cursor:pointer;border:1px solid rgba(62,207,142,.4);background:rgba(62,207,142,.1);color:var(--gn);border-radius:8px;padding:8px 12px;font-size:11.5px;font-family:inherit;transition:all .15s}
.certbtn:hover{background:rgba(62,207,142,.2)}
.certbtn:disabled{opacity:.35;cursor:not-allowed}
/* ============ 底部条 ============ */
.strip{display:flex;align-items:center;gap:16px;padding:0 18px;border-top:1px solid var(--line);background:rgba(255,253,248,.84);backdrop-filter:blur(10px);font-size:11px;color:var(--tx3)}
.strip .spacer{flex:1}
.strip a{color:var(--tx2);text-decoration:none;border-bottom:1px dashed var(--tx3);cursor:pointer}
.strip a:hover{color:var(--cy)}
/* ============ 展区抽屉 ============ */
.scrim{position:fixed;inset:0;background:rgba(74,64,48,.34);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center}
.scrim.on{display:flex}
.zonepanel{width:min(1020px,94vw);max-height:86vh;background:linear-gradient(160deg,#fffdf8,#f7f2e7);border:1px solid rgba(14,127,156,.28);border-radius:16px;padding:26px 30px;animation:zoomin .35s cubic-bezier(.3,1.4,.6,1);overflow:auto}
@keyframes zoomin{from{transform:scale(.92) translateY(14px);opacity:0}}
.zonepanel .zh{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.zonepanel .zh .zi{font-family:var(--mono);font-size:12px;color:var(--cy);border:1px solid rgba(87,199,255,.35);border-radius:6px;padding:2px 9px}
.zonepanel .zh h2{font-size:21px;letter-spacing:2px}
.zonepanel .zq{font-size:12.5px;color:var(--tx2);margin-bottom:18px}
.zcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
/* 抽屉里的展品卡 */
.ecard{cursor:pointer;border:1px solid var(--line);background:linear-gradient(160deg,#fffdf8,#f6f1e6);border-radius:12px;padding:14px 16px 12px;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative}
.ecard:hover{transform:translateY(-4px);border-color:var(--zc,#57c7ff);box-shadow:0 16px 34px -14px var(--zc-soft,rgba(87,199,255,.45))}
.ecard .etop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ecard .eno{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--tx3)}
.ecard .egi{font-size:22px;filter:grayscale(.4) brightness(.85);transition:filter .2s}
.ecard.got .egi{filter:none}
.ecard h3{font-size:15px;margin-bottom:5px}
.ecard .one{font-size:11.5px;color:var(--tx2);line-height:1.7;margin-bottom:9px}
.ecard .efoot{display:flex;align-items:center;gap:8px}
.ecard .lay{font-size:9.5px;font-family:var(--mono);color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.ecard .lay.on{color:var(--zc,#57c7ff);border-color:var(--zc-soft,rgba(87,199,255,.35))}
.ecard .gt{margin-left:auto;font-size:11px;color:var(--tx3);transition:color .2s}
.ecard:hover .gt{color:var(--zc,#57c7ff)}
.ecard.got::after{content:"已识破 ✓";position:absolute;top:10px;right:-26px;transform:rotate(38deg);font-size:9px;font-family:var(--mono);color:#fff;background:rgba(28,138,92,.88);border:1px solid rgba(28,138,92,.9);padding:2px 28px}
/* ============ 展品全屏舱室 ============ */
.room{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.room.on{display:flex;animation:fadein .3s ease}
.room .rhead{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.room .rhead .back{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);border-radius:8px;padding:6px 13px;font-size:12.5px;font-family:inherit}
.room .rhead .back:hover{color:var(--cy);border-color:rgba(87,199,255,.4)}
.room .rhead h2{font-size:16px}
.room .rhead .rone{font-size:11.5px;color:var(--tx2)}
.room iframe{flex:1;border:0;width:100%;background:var(--bg)}
/* ============ 命令面板 ============ */
.cmdwrap{position:fixed;inset:0;z-index:80;background:rgba(74,64,48,.30);backdrop-filter:blur(5px);display:none;justify-content:center;padding-top:12vh}
.cmdwrap.on{display:flex}
.cmd{width:min(560px,92vw);height:fit-content;background:linear-gradient(160deg,#fffdf8,#f7f2e7);border:1px solid rgba(14,127,156,.35);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -22px rgba(120,100,66,.45)}
.cmd input{width:100%;background:transparent;border:none;outline:none;color:var(--tx);font-size:15px;padding:16px 20px;border-bottom:1px solid var(--line);font-family:inherit}
.cmd .results{max-height:320px;overflow:auto}
.cmd .ritem{display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer;font-size:13.5px;color:var(--tx2)}
.cmd .ritem .ri{width:22px;text-align:center;flex:none}
.cmd .ritem.sel{background:rgba(14,127,156,.10);color:var(--tx)}
.cmd .ritem small{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3)}
/* ============ toast ============ */
.toasts{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(160deg,#f2fbf6,#e6f5ed);border:1px solid rgba(28,138,92,.42);border-radius:10px;padding:10px 18px;font-size:12.5px;color:var(--tx);display:flex;align-items:center;gap:10px;animation:toastin .4s cubic-bezier(.3,1.5,.6,1);box-shadow:0 12px 30px -12px rgba(28,138,92,.35)}
@keyframes toastin{from{transform:translateY(16px) scale(.9);opacity:0}}
/* ============ 证书 ============ */
.cert{width:min(560px,92vw);background:linear-gradient(160deg,#fffdf8,#f7f2e7);border:1px solid rgba(176,116,28,.45);border-radius:16px;padding:34px 36px;text-align:center;position:relative;animation:zoomin .4s cubic-bezier(.3,1.5,.6,1)}
.cert::before{content:"";position:absolute;inset:9px;border:1px dashed rgba(176,116,28,.32);border-radius:11px;pointer-events:none}
.cert .cn{font-size:11px;letter-spacing:4px;color:var(--cy);font-family:var(--mono);margin-bottom:12px}
.cert h2{font-size:26px;letter-spacing:3px;margin-bottom:10px}
.cert .line{color:var(--tx2);font-size:13px;line-height:1.9;margin-bottom:16px}
.cert .line b{color:var(--gn)}
.cert .sig{font-family:var(--mono);font-size:11px;color:var(--tx3)}
/* ============ 背景选择 ============ */
.bgpanel{width:min(920px,94vw);max-height:86vh;background:linear-gradient(160deg,#fffdf8,#f7f2e7);border:1px solid rgba(14,127,156,.28);border-radius:16px;padding:24px 26px;animation:zoomin .35s cubic-bezier(.3,1.4,.6,1);overflow:auto}
.bgpanel .bh{margin-bottom:16px}
.bgpanel .bh h2{font-size:19px;letter-spacing:1px;margin-bottom:4px}
.bgpanel .bh span{font-size:11.5px;color:var(--tx2)}
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.bgopt{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0;overflow:hidden;transition:all .18s;text-align:left;font-family:inherit}
.bgopt:hover{transform:translateY(-3px);border-color:rgba(14,127,156,.45);box-shadow:0 10px 24px -14px rgba(14,127,156,.5)}
.bgopt.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}
.bgopt .th{height:74px;display:block}
.bgopt .lb{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;font-size:12px;color:var(--tx)}
.bgopt .lb i{font-style:normal;font-size:9.5px;color:var(--tx3);font-family:var(--mono)}
.bgopt.on .lb i{color:var(--cy)}
/* ============ 导游天团 ============ */
.gtabs{display:flex;gap:6px;padding:0 18px 10px}
.gtab{cursor:pointer;flex:1;border:1px solid var(--line);background:var(--panel);color:var(--tx3);border-radius:9px;padding:5px 2px;font-size:15px;font-family:inherit;transition:all .18s;line-height:1}
.gtab:hover{color:var(--tx);border-color:#cbbfa9;transform:translateY(-2px)}
.gtab.on{color:var(--tx);border-color:rgba(123,79,208,.5);background:linear-gradient(180deg,rgba(123,79,208,.10),var(--panel));box-shadow:0 4px 14px -8px rgba(123,79,208,.45)}
.gtab small{display:block;font-size:8.5px;margin-top:3px;letter-spacing:.5px}
/* ============ 背景场景舞台（壁纸级，每主题独立构图） ============ */
#bgStage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.app{position:relative;z-index:1}
#bgStage>*{position:absolute}
/* 无 WebGL 时的兜底层：暗角 + 颗粒（12 套厅堂共用） */
.bgm-vig{inset:0;background:radial-gradient(ellipse 96% 88% at 50% 44%,transparent 42%,rgba(150,134,104,.20) 100%)}
.bgm-grain{inset:0;opacity:.035;background-image:repeating-radial-gradient(circle at 30% 20%,#6b5f48 0 .5px,transparent .5px 2px);background-size:4px 4px}
@keyframes bgTwinkle{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bgBreathe{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.12);opacity:1}}
@keyframes bgSway{0%,100%{transform:skewX(-14deg) translateX(0)}50%{transform:skewX(-9deg) translateX(3.5%)}}
@keyframes bgRise{from{transform:translateY(14vh)}to{transform:translateY(-112vh)}}
@keyframes bgFlick{0%,86%{opacity:.3}89%{opacity:.95}93%,100%{opacity:.28}}
@keyframes bgMeteor{0%,84%{transform:translate(0,0) rotate(16deg);opacity:0}87%{opacity:1}100%{transform:translate(72vw,30vh) rotate(16deg);opacity:0}}
@keyframes bgDrift{from{transform:translate(-2%,-1%)}to{transform:translate(3%,2%)}}
@keyframes bgFog{from{transform:translateX(-7%)}50%{transform:translateX(7%)}to{transform:translateX(-7%)}}
@keyframes bgDune1{to{transform:translateX(2.5%)}}
@keyframes bgDune2{to{transform:translateX(-3%)}}
@keyframes bgPulse{0%,100%{opacity:.75;filter:brightness(1)}50%{opacity:1;filter:brightness(1.3)}}
@keyframes bgAurora{from{transform:skewX(-18deg) translateX(-4%) scaleY(1)}50%{transform:skewX(-8deg) translateX(5%) scaleY(1.16)}to{transform:skewX(-21deg) translateX(-2%) scaleY(.9)}}
@keyframes bgGrid{from{background-position:0 0,0 0}to{background-position:0 44px,0 0}}
@keyframes bgRain{from{background-position:0 0,0 0}to{background-position:0 340px,0 220px}}

/* —— 星海：三层视差星空 + 银河带 + 流星 —— */
.bg-stars{inset:-8% -8% 0;background-image:radial-gradient(1px 1px at 12% 20%,rgba(255,255,255,.85),transparent),radial-gradient(1px 1px at 34% 68%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 72% 52%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 44% 84%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 8% 76%,rgba(174,198,255,.65),transparent),radial-gradient(1px 1px at 63% 33%,rgba(255,255,255,.55),transparent);background-size:460px 460px;background-repeat:repeat;animation:bgTwinkle 6s ease-in-out infinite}
