      `<svg id="cutBars" style="width:100%;height:152px;flex:none;display:block"></svg>` +
      `</div>` +
      `<div class="card-f"><span>T<sub>w</sub> = ρ<sup>ℓ</sup>P<sub>w</sub> + (1−ρ<sup>ℓ</sup>)U</span><span>上：K×K 核（亮 = 偏离均匀）</span><span>下：端点律 live vs bypass</span></div>`;
    root.appendChild(lc);

    const R = el("div", "stack");

    const dc = chartCard(
      "ρ<sup>ℓ</sup> 与扰动地板 2ℓξ",
      "ℓ = " + p.l,
      `<span style="color:#5ee7ff">— ρ^ℓ 信号</span><span style="color:#ff6b8b">-- 2ℓξ 地板</span>`,
      170
    );
    R.appendChild(dc.card);

    const rows = [
      ["当前 K=" + p.K + " ρ=" + p.rho.toFixed(3) + " ℓ=" + Math.min(p.l, 24), F.verifyTheorem2(p.rho, p.K, 1, Math.min(p.l, 24))],
      ["K=3 ρ=0.900 ℓ=20", F.verifyTheorem2(0.9, 3, 1, 20)],
      ["K=4 ρ=0.850 ℓ=12", F.verifyTheorem2(0.85, 4, 1, 12)],
      ["K=2 ρ=0.950 ℓ=20", F.verifyTheorem2(0.95, 2, 1, 20)]
    ];
    const vc = el("div", "card col");
    vc.style.flex = "none";
    vc.innerHTML =
      `<div class="card-h"><span class="d"></span>定理 2 · 数值核验<span class="r">直接构造 vs ℓ 次 matmul</span></div>` +
      `<div class="card-b" style="padding:8px 12px 10px"><table class="tbl"><tbody>` +
      rows.map(([k, v]) => {
        const ok = v < 1e-12;
        return `<tr><td style="font-family:var(--f-mono);font-size:10px;color:var(--dim-2)">${k}</td>` +
          `<td class="num" style="color:${ok ? "var(--emerald)" : "var(--rose)"};font-size:10.5px">${v.toExponential(2)}</td>` +
          `<td style="width:38px;text-align:right"><span class="tag ${ok ? "em" : "ro"}" style="font-size:8px;padding:1px 4px">${ok ? "PASS" : "FAIL"}</span></td></tr>`;
      }).join("") +
      `</tbody></table></div>`;
    R.appendChild(vc);

    root.appendChild(R);

    return {
      root,
      draw() {
        const ms = $("#cutMat", lc);
        const host = ms.parentElement;
        const side = Math.max(210, Math.min(Math.round(host.clientWidth), Math.round(host.clientHeight), 460));
        ms.style.width = side + "px";
        ms.style.height = side + "px";
        ms.style.margin = "0 auto";
        ms.setAttribute("viewBox", `0 0 ${side} ${side}`);
        G.matrix(ms, { K: p.K, matrix: F.kernelWord(p.rho, p.K, 1, p.l) });
        endpointBars($("#cutBars", lc), d.r, p.K);

        const A = [], B = [];
        for (let l = 1; l <= 60; l++) {
          A.push([l, Math.pow(p.rho, l)]);
          B.push([l, Math.min(1, 2 * l * p.xi)]);
        }
        const g2 = G.chart(dc.svg, {
          w: 500, h: 260,
          xDomain: [1, 60], yDomain: [1e-4, 1.3], yLog: true,
          xTicks: [1, 10, 20, 30, 40, 50, 60],
          yTicks: [1e-4, 1e-3, 1e-2, 1e-1, 1],
          yFmt: powFmt,
          xLabel: "切口长度 ℓ", yLabel: "端点距离 / 地板",
          series: [
            { pts: A, color: G.C.cyan, width: 2 },
            { pts: B, color: G.C.rose, width: 1.4, dash: "5 4" }
          ],
          marks: [{ x: p.l, y: Math.pow(p.rho, p.l), color: G.C.cyan, label: "ℓ = " + p.l, dx: 8, dy: -9 }]
        });
        G.bindHover(dc.svg, g2, [
          { pts: A, label: "ρ^ℓ 信号", color: G.C.cyan, fmt: v => F.fmtNum(v, 5) },
          { pts: B, label: "2ℓξ 地板", color: G.C.rose, fmt: v => F.fmtNum(v, 5) }
        ], x => "ℓ = " + x);
      }
    };
  }

  /* ==========================================================================
     7 · 模块 04 · 证据代价（定理 3）
     ========================================================================== */
  function modEvidence(d, p) {
    const root = el("div", "split");

    const ec = chartCard(
      "e*<sub>N</sub> 与定理 3 的两侧界",
      "δ = " + F.fmtNum(p.delta, 3),
      `<span style="color:#5ee7ff">— 精确递归 eq.(46)</span><span style="color:#ffc76b">-- ½e^−NC</span><span style="color:#ffc76b;opacity:.6">-- ¼e^−2NC</span><span style="margin-left:auto">N 超过 N* 后 e* 跌破 1e−9，图上不可见</span>`,
      220
    );
    root.appendChild(ec.card);

    const R = el("div", "stack");
    const nc = chartCard("N* 随切口长度 ℓ 的增长", "Θ(ρ⁻²ℓ)", `<span>固定 δ 与 K，只改 ℓ</span>`, 150);
    R.appendChild(nc.card);

    const ab = F.alphaBeta(d.r, p.K);
    const rc = el("div", "card col");
    rc.style.flex = "none";
    rc.innerHTML =
      `<div class="card-h"><span class="d"></span>读数量<span class="r">r = ρ^ℓ</span></div>` +
      `<div class="card-b" style="padding:6px 14px 10px">` +
      readRows([
        ["r = ρ<sup>ℓ</sup>", F.fmtNum(d.r, 5), "cy"],
        ["α = r + (1−r)/K", F.fmtNum(ab.a, 5)],
        ["β = (1−r)/K", F.fmtNum(ab.b, 5)],
        ["C<sub>K</sub>(r) = −log B<sub>K</sub>(r)", F.fmtNum(d.ck, 6), "vi"],
        ["N* = ⌈log(1/δ)/C⌉", F.fmtInt(d.ns), d.sEv === "ok" ? "em" : d.sEv === "thin" ? "am" : "ro"],
        ["ρ<sup>−2ℓ</sup>（证据代价尺度）", F.fmtNum(Math.pow(p.rho, -2 * p.l), 4), "am"]
      ]) +
      `</div>`;
    R.appendChild(rc);
    root.appendChild(R);

    return {
      root,
      draw() {
        const C = d.ck;
        const xMax = Math.min(1e6, Math.max(30, Math.pow(10, Math.ceil(Math.log10(Math.max(isFinite(d.ns) ? d.ns * 4 : 1e5, 20))))));
        const hi = [], lo = [], ex = [];
        if (isFinite(C) && C > 0) {
          for (let i = 0; i <= 46; i++) {
            const x = Math.pow(xMax, i / 46);
            hi.push([x, 0.5 * Math.exp(-x * C)]);
            lo.push([x, 0.25 * Math.exp(-2 * x * C)]);
          }
        }
        const Ncap = Math.min(240, Math.max(30, Math.round(Math.min(d.N, xMax))));
        for (let N = 1; N <= Math.min(20, Ncap); N++) ex.push([N, F.estarExact(N, d.r, p.K)]);
        let NN = 24;
        while (NN <= Ncap) { ex.push([NN, F.estarExact(NN, d.r, p.K)]); NN = Math.round(NN * 1.28); }

        const vl = [];
        if (isFinite(d.ns) && d.ns >= 1 && d.ns <= xMax) {
          vl.push({ x: d.ns, color: G.C.gold, label: "N* = " + F.fmtInt(d.ns), labelY: 12 });
        }
        if (d.N <= xMax) vl.push({ x: d.N, color: G.C.cyan, label: "N = " + F.fmtInt(d.N), labelY: 26 });

        const xT = [];
        for (let v = 1; v <= xMax * 1.001; v *= 10) xT.push(v);

        const geom = G.chart(ec.svg, {
          w: 620, h: 320,
          xDomain: [1, xMax], xLog: true, yDomain: [1e-9, 1], yLog: true,
          xTicks: xT,
          yTicks: [1e-9, 1e-7, 1e-5, 1e-3, 1e-1, 1],
          xFmt: powFmt, yFmt: powFmt,
          xLabel: "独立重置试验数 N", yLabel: "审计误差 e*",
          series: [
            { pts: hi, color: G.C.amber, width: 1.2, dash: "5 4", opacity: 0.85 },
            { pts: lo, color: G.C.amber, width: 1.2, dash: "2 4", opacity: 0.55 },
            { pts: ex, color: G.C.cyan, width: 2.2 }
          ],
          hlines: [{ y: p.delta, color: "rgba(255,107,139,.55)", label: "δ = " + F.fmtNum(p.delta, 3) }],
          vlines: vl
        });
        G.bindHover(ec.svg, geom, [
          { pts: ex, label: "e* 精确", color: G.C.cyan, fmt: v => F.fmtNum(v, 4) },
          { pts: hi, label: "½e^−NC", color: G.C.amber, fmt: v => F.fmtNum(v, 4) }
        ], x => "N = " + F.fmtInt(x));

        const ns = [];
        for (let l = 1; l <= 60; l++) {
          const r = Math.pow(p.rho, l), c = F.CK(r, p.K);
          const v = (isFinite(c) && c > 0) ? Math.ceil(LOG(1 / p.delta) / c) : Infinity;
          ns.push([l, v > 1e9 ? NaN : v]);
        }
        G.chart(nc.svg, {
          w: 500, h: 260,
          xDomain: [1, 60], yDomain: [1, 1e9], yLog: true,
          xTicks: [1, 10, 20, 30, 40, 50, 60],
          yTicks: [1, 1e3, 1e6, 1e9],
          yFmt: powFmt,
          xLabel: "切口长度 ℓ", yLabel: "N*",
          series: [{ pts: ns, color: G.C.violet, width: 2, area: true, areaOpacity: 0.12 }],
          marks: isFinite(d.ns) && d.ns <= 1e9
            ? [{ x: p.l, y: Math.max(1, d.ns), color: G.C.violet, label: "ℓ = " + p.l, dx: 8, dy: -9 }]
            : []
        });
      }
    };
  }

  /* ==========================================================================
     8 · 模块 05 · 写入预算（定理 4）
     ========================================================================== */
  function modBudget(d, p) {
    const root = el("div", "split");
    const h = (p.m - 1) / 2;

    const lc = el("div", "card col");
    lc.innerHTML =
      `<div class="card-h"><span class="d"></span>写入的 m 位 · 点击翻转模拟读取噪声<span class="r">m = 2h+1，c = h+1</span></div>` +
      `<div class="card-b" style="flex:none;display:flex;flex-direction:column;gap:9px">` +
      `<div class="bits" id="bitRow"></div>` +
      `<div class="bits-hint" id="bitHint"></div>` +
      `<svg id="budStrip" style="width:100%;height:54px;display:block;flex:none"></svg>` +
      `</div>` +
      `<div class="card-b" style="flex:1;min-height:0;padding-top:0;display:flex;flex-direction:column">` +
      `<div class="chartwrap" style="min-height:150px"><svg class="chart" id="budChart"></svg></div></div>` +
      `<div class="card-f"><span>W &lt; c 时 M = 0 ⇒ e* = 1/2</span><span>任何训练时刻都不可区分</span></div>`;

    function paintBits() {
      const row = $("#bitRow", lc);
      row.innerHTML = "";
      for (let i = 0; i < p.m; i++) {
        const fl = S.flips.indexOf(i) >= 0;
        const b = el("button", "bit" + (fl ? " flip" : ""),
          `<span class="b">${fl ? 0 : 1}</span><span class="i">b${i + 1}</span>`);
        b.addEventListener("click", () => {
          const k = S.flips.indexOf(i);
          if (k >= 0) S.flips.splice(k, 1); else S.flips.push(i);
          paintBits();
        });
        row.appendChild(b);
      }
      const r = S.flips.filter(i => i < p.m).length;
      const ok = r <= h;
      const hint = $("#bitHint", lc);
      hint.className = "bits-hint" + (ok ? " ok" : "");
      hint.innerHTML = `翻转 <b>${r}</b> 位 · 容错 h = ${h} · 多数票 <b>${ok ? "仍正确" : "失效"}</b>`;
    }

    paintBits();

    const R = el("div", "stack");

    const rc = el("div", "card col");
    rc.style.flex = "none";
    rc.innerHTML =
      `<div class="card-h"><span class="d"></span>定理 4 的四行<span class="r">m = 2h+1</span></div>` +
      `<div class="card-b" style="padding:6px 14px 10px">` +
      readRows([
        ["h = (m−1)/2", String(h)],
        ["c = h+1（每次审计的写入代价）", String(d.c), "am"],
        ["M = min(N, ⌊W/c⌋)", F.fmtInt(d.M), "cy"],
        ["e*<sub>audit</sub> = e*<sub>M</sub>(ρ<sup>ℓ</sup>)", F.fmtNum(d.eB, 4), d.sBd === "ok" ? "em" : d.sBd === "thin" ? "am" : "ro"],
        ["W 的临界值（W &lt; c 即失效）", String(d.c), "ro"]
      ]) +
      `</div>`;
    R.appendChild(rc);

    const pc = el("div", "card col");
    pc.style.flex = "1";
    pc.innerHTML =
      `<div class="card-h"><span class="d"></span>为什么是「前沿」而不是「阈值」</div>` +
      `<div class="card-b" style="display:flex;flex-direction:column;justify-content:center"><div class="prose" style="font-size:11.5px">` +
      `写入预算是<b>审计能做多少次</b>的物理上限：每次审计要读 c = h+1 个 bit，` +
      `W 个 bit 只够 ⌊W/c⌋ 次。当它小于 1 次时，<span class="hlr">M = 0，审计误差恒为 1/2</span> ——` +
      `不是「不够准」，而是<b>完全没有信息</b>。` +
      `<br><br>这正是前沿的形状：在 W ≥ c 之前是一条死线，越过之后误差才按 e<sup>−MC</sup> 指数下降。` +
      `定理 4 的结论是 <b>e*<sub>audit</sub> = e*<sub>M</sub>(ρ<sup>ℓ</sup>)</b>，把写入与证据两个预算合成一个时钟。` +
      `</div></div>`;
    R.appendChild(pc);

    root.appendChild(lc);
    root.appendChild(R);

    return {
      root,
      draw() {
        budgetStrip($("#budStrip", lc), p.W, d.c, d.M);
        const Wmax = Math.min(160, Math.max(24, p.W * 2));
        const ex = [], bd = [];
        const C = F.CK(d.r, p.K);
        const stepW = Wmax > 60 ? 4 : 2;
        for (let w = 0; w <= Wmax; w += stepW) {
          const M = Math.min(d.N, Math.floor(w / d.c));
          ex.push([w, M <= 0 ? 0.5 : F.estarExact(Math.min(M, 90), d.r, p.K)]);
          bd.push([w, M <= 0 ? 0.5 : Math.min(0.5, 0.5 * Math.exp(-M * (isFinite(C) ? C : 0)))]);
        }
        const gb = G.chart($("#budChart", lc), {
          w: 620, h: 280,
          xDomain: [0, Wmax], yDomain: [1e-6, 0.6], yLog: true,
          yTicks: [1e-6, 1e-4, 1e-2, 1e-1],
          yFmt: powFmt,
          xLabel: "写入预算 W (bit)", yLabel: "审计误差 e*",
          series: [
            { pts: bd, color: G.C.amber, width: 1.2, dash: "5 4", opacity: 0.8 },
            { pts: ex, color: G.C.cyan, width: 2.2, area: true, areaOpacity: 0.1 }
          ],
          hlines: [{ y: p.delta, color: "rgba(255,107,139,.5)", label: "δ = " + F.fmtNum(p.delta, 3) }],
          vlines: [{ x: d.c, color: G.C.rose, label: "W = c = " + d.c, labelY: 12 }],
          marks: [{ x: p.W, y: Math.max(1e-6, d.eB), color: G.C.cyan, label: "W = " + p.W, dx: 8, dy: -9 }]
        });
        G.bindHover($("#budChart", lc), gb, [
          { pts: ex, label: "e* 精确", color: G.C.cyan, fmt: v => F.fmtNum(v, 5) },
          { pts: bd, label: "½e^−MC", color: G.C.amber, fmt: v => F.fmtNum(v, 5) }
        ], x => "W = " + x + " bit");
      }
    };
  }

  /* ==========================================================================
     9 · 模块 06 · 三条时钟（定理 5 / 推论 6）
     ========================================================================== */
  function modClocks(d, p) {
    const root = el("div", "split");
    const tgt = 1 - p.eps;

    const cc = chartCard(
      "A<sub>L</sub>(t) 与 F<sub>L</sub>(t)",
      "K = " + p.K + " · L = " + p.L,
      `<span style="color:#5ee7ff">— A_L 端点正确率</span><span style="color:#a78bfa">— F_L 轨迹忠实度</span><span style="color:#f5d67b">-- 1−ε</span>`,
      240
    );
    root.appendChild(cc.card);

    const R = el("div", "stack");

    const kc = el("div", "card col");
    kc.style.flex = "none";
    kc.innerHTML =
      `<div class="card-h"><span class="d"></span>三条时钟<span class="r">同一训练过程，三个时刻</span></div>` +
      `<div class="card-b" style="padding:6px 14px 10px">` +
      readRows([
        ["t<sub>det</sub> ≈ 2L/log N", F.fmtNum(d.tdet, 2), "am"],
        ["t<sub>acc</sub> = A<sub>L</sub><sup>−1</sup>(1−ε)", F.fmtNum(d.tacc, 2), "cy"],
        ["t<sub>tr</sub> = F<sub>L</sub><sup>−1</sup>(1−ε)", F.fmtNum(d.ttr, 2), "vi"],
        ["t<sub>acc</sub> / t<sub>det</sub>", F.fmtNum(d.tacc / Math.max(d.tdet, 1e-9), 1) + "×", "ro"],
        ["t<sub>acc</sub>/L → 1/(−log h<sub>ε</sub>)", F.fmtNum(F.accSlope(p.K, p.eps), 2)],
        ["t<sub>tr</sub>/L → (K−1)/(K(−log(1−ε)))", F.fmtNum(F.trSlope(p.K, p.eps), 2)]
      ]) +
      `</div>`;
    R.appendChild(kc);

    const sc = chartCard("三个时刻随 L 的斜率不同", "N = " + F.fmtInt(d.N), `<span>检测线性但系数极小 ⇒ 远早于能力</span>`, 140);
    R.appendChild(sc.card);
    root.appendChild(R);

    return {
      root,
      draw() {
        const tMax = Math.max(isFinite(d.tacc) ? d.tacc : 0, isFinite(d.ttr) ? d.ttr : 0, 4) * 1.4;
        const A = [], Bp = [];
        for (let i = 0; i <= 150; i++) {
          const t = 0.4 * Math.pow(tMax / 0.4, i / 150);
          A.push([t, F.AL(t, p.K, p.L)]);
          Bp.push([t, F.FL(t, p.K, p.L)]);
        }
        const vl = [{ x: d.tdet, color: G.C.amber, label: "t_det", labelY: 12 }];
        if (isFinite(d.tacc)) vl.push({ x: d.tacc, color: G.C.cyan, label: "t_acc", labelY: 26 });
        if (isFinite(d.ttr)) vl.push({ x: d.ttr, color: G.C.violet, label: "t_tr", labelY: 40 });

        const xT = [];
        for (let v = 1; v <= tMax; v *= 10) xT.push(v);

        const g1 = G.chart(cc.svg, {
          w: 620, h: 340,
          xDomain: [0.4, tMax], xLog: true, yDomain: [0, 1.04],
          xTicks: xT, xFmt: powFmt,
          xLabel: "归一化梯度流时间 t", yLabel: "概率",
          series: [
            { pts: A, color: G.C.cyan, width: 2.2 },
            { pts: Bp, color: G.C.violet, width: 2.2 }
          ],
          hlines: [{ y: tgt, color: "rgba(245,214,123,.55)", label: "1−ε = " + tgt.toFixed(2) }],
          vlines: vl
        });
        G.bindHover(cc.svg, g1, [
          { pts: A, label: "A_L 端点", color: G.C.cyan, fmt: v => v.toFixed(4) },
          { pts: Bp, label: "F_L 轨迹", color: G.C.violet, fmt: v => v.toFixed(4) }
        ], x => "t = " + F.fmtNum(x, 1));

        const ts = [], ta = [], tt = [];
        for (let L = 8; L <= 512; L += 8) {
          ts.push([L, F.tDet(L, d.N)]);
          ta.push([L, F.tAcc(p.K, L, p.eps)]);
          tt.push([L, F.tTr(p.K, L, p.eps)]);
        }
        const yTop = Math.max(F.tAcc(p.K, 512, p.eps), F.tTr(p.K, 512, p.eps), 10) * 1.6;
        G.chart(sc.svg, {
          w: 500, h: 240,
          xDomain: [8, 512], yDomain: [0.8, yTop], yLog: true,
          xTicks: [8, 128, 256, 384, 512],
          yTicks: [1, 10, 100, 1000, 10000].filter(v => v <= yTop),
          yFmt: powFmt,
          xLabel: "组合长度 L", yLabel: "时刻 t（对数）",
          series: [
            { pts: ts, color: G.C.amber, width: 1.8 },
            { pts: ta, color: G.C.cyan, width: 1.8 },
            { pts: tt, color: G.C.violet, width: 1.8, dash: "4 3" }
          ],
          vlines: [{ x: p.L, color: "rgba(150,168,205,.4)", label: "L = " + p.L, labelY: 12 }]
        });
      }
    };
  }

  /* ==========================================================================
     10 · 模块 07 · 认证台
     ========================================================================== */
  function certText(d, p) {
    const H = horizon(p, d);
    const ev = d.sEv === "ok" ? "成立" : d.sEv === "thin" ? "勉强" : "不成立";
    const bd = d.sBd === "ok" ? "成立" : d.sBd === "thin" ? "勉强" : "不成立";
    const lc = d.sLc === "ok" ? "成立" : d.sLc === "thin" ? "勉强" : "不成立";
    const bind = H.all === H.ev ? "证据" : H.all === H.bd ? "写入" : "扰动地板";
    return [
      "认证地平线 · 局部证书",
      "─────────────────────────────",
      `接口      受保护切口（一次替换 S = a0 ≠ s）`,
      `参数      K=${p.K}  ρ=${p.rho.toFixed(3)}  ℓ=${p.l}  L=${p.L}`,
      `          N=2^${p.nExp}=${F.fmtInt(d.N)}  δ=${p.delta}  ε=${p.eps}`,
      `          W=${p.W} bit  m=${p.m}  ξ=${p.xi}`,
      "",
      `端点距离  r = ρ^ℓ = ${F.fmtNum(d.r, 6)}`,

      `C_K(r) = ${F.fmtNum(d.ck, 6)}`,

  function verdictHTML(d, p) {
    const H = horizon(p, d);
    const col = s => `color:var(--${sCls(s)})`;
    const parts = [];
    parts.push(`当前参数下，受保护切口的端点对比恰为 <b>r = ρ<sup>ℓ</sup> = ${F.fmtNum(d.r, 4)}</b>。`);
    parts.push(`证据路线<span style="${col(d.sEv)}">${sWord(d.sEv)}</span>（需 N* = ${F.fmtInt(d.ns)}，现有 N = ${F.fmtInt(d.N)}）`);
    parts.push(`写入路线<span style="${col(d.sBd)}">${sWord(d.sBd)}</span>（M = ${F.fmtInt(d.M)} 次审计，e* = ${F.fmtNum(d.eB, 4)}）`);
    parts.push(`本地重置<span style="${col(d.sLc)}">${sWord(d.sLc)}</span>（NL = ${F.fmtInt(d.avail)} 对 Q* = ${F.fmtInt(d.Q)}）`);
    const bind = H.all === H.ev ? "证据" : H.all === H.bd ? "写入" : "扰动地板";
    return parts.join("；") + `。三者同时成立的切口上限为 <b>ℓ* = ${H.all}</b>，` +
      `此处瓶颈是<b>${bind}</b>。`;
  }

      `</div>` +
      `<div class="card-f"><button class="tbtn" id="btnCopyCert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>复制证书</button><span>可直接粘进论文附录</span></div>`;

    const pre = $("#certTxt", bc);

    $("#btnCopyCert", bc).addEventListener("click", () => {

  function modRepro(d, p) {
    const root = el("div", "split");

    const res2 = F.verifyTheorem2(p.rho, p.K, 1, Math.min(p.l, 24));
    const Nn = Math.min(Math.max(1, Math.round(d.N)), 40);
    const bd = F.estarBounds(Nn, d.r, p.K);
    const exv = F.estarExact(Nn, d.r, p.K);
    const aErr = Math.abs(F.AL(d.tacc, p.K, p.L) - (1 - p.eps));
    const fErr = Math.abs(F.FL(d.ttr, p.K, p.L) - (1 - p.eps));
    const cliff = F.budgetM(d.N, d.c - 1, p.m) === 0;
    const eta = F.etaForEps(p.eps, p.L);
    const comp = 1 - Math.pow(1 - eta, p.L);
    const compOk = comp <= p.L * eta + 1e-15;
    const slope = Math.abs(F.tAcc(p.K, 1024, p.eps) / 1024 - F.accSlope(p.K, p.eps));

    const checks = [
      ["定理 2", "端点距离恒等式", "ρ<sup>ℓ</sup>P<sub>w</sub>+(1−ρ<sup>ℓ</sup>)U 与 ℓ 次 matmul 的最大偏差", res2.toExponential(2), res2 < 1e-12],
      ["定理 3", "双侧界夹住精确值", `N=${Nn}：¼e^−2NC ≤ e* ≤ ½e^−NC`, `${bd.lo.toExponential(1)} ≤ ${exv.toExponential(1)} ≤ ${bd.hi.toExponential(1)}`, bd.lo <= exv && exv <= bd.hi],
      ["定理 3", "小 r 展开 C<sub>K</sub>(r) ≈ Kr²/4", "r = 0.02 处相对误差", (() => { const r0 = 0.02, a1 = F.CK(r0, p.K), a2 = F.CKsmall(r0, p.K); return Math.abs(a1 - a2) / a1; })().toFixed(4), (() => { const r0 = 0.02, a1 = F.CK(r0, p.K), a2 = F.CKsmall(r0, p.K); return Math.abs(a1 - a2) / a1 < 0.06; })()],
      ["定理 5", "端点达标时刻", "A<sub>L</sub>(t<sub>acc</sub>) = 1−ε", aErr.toExponential(1), aErr < 1e-9],
      ["定理 5", "轨迹达标时刻", "F<sub>L</sub>(t<sub>tr</sub>) = 1−ε", fErr.toExponential(1), fErr < 1e-9],
      ["定理 4", "写入悬崖", `W = c−1 = ${d.c - 1} ⇒ M = 0`, cliff ? "M = 0" : "M ≠ 0", cliff],
      ["定理 7", "组合界", "1−(1−η)<sup>L</sup> ≤ Lη", `${comp.toExponential(1)} ≤ ${(p.L * eta).toExponential(1)}`, compOk],
      ["推论 6", "斜率收敛", "L=1024 处 |t<sub>acc</sub>/L − 常数|", slope.toExponential(1), slope < 1e-2]
    ];

    const pass = checks.filter(c => c[4]).length;

    const tc = el("div", "card col");
    tc.innerHTML =
      `<div class="card-h"><span class="d"></span>Table 1 · 数值复现<span class="r">${pass} / ${checks.length} 通过</span></div>` +
      `<div class="card-b" style="padding:10px 12px;display:flex;flex-direction:column"><table class="tbl tbl-fill">` +
      `<thead><tr><th>定理</th><th>检查</th><th style="text-align:right">结果</th><th style="width:44px;text-align:right">判定</th></tr></thead><tbody>` +
      checks.map(c =>
        `<tr><td style="font-family:var(--f-mono);font-size:9px;color:var(--dim-2);white-space:nowrap">${c[0]}</td>` +
        `<td><span style="color:var(--ink-2)">${c[1]}</span><br><span style="font-family:var(--f-mono);font-size:9px;color:var(--faint)">${c[2]}</span></td>` +
        `<td class="num" style="font-size:10px;color:${c[4] ? "var(--emerald)" : "var(--rose)"}">${c[3]}</td>` +
        `<td style="text-align:right"><span class="tag ${c[4] ? "em" : "ro"}" style="font-size:8px;padding:1px 4px">${c[4] ? "PASS" : "FAIL"}</span></td></tr>`
      ).join("") +
      `</tbody></table></div>` +
      `<div class="card-f"><span>全部检查在浏览器内实时重算</span><span>没有预存数字</span></div>`;
    root.appendChild(tc);

    const R = el("div", "stack");

    const cc = el("div", "card col");
    cc.style.flex = "none";
    cc.innerHTML =
      `<div class="card-h"><span class="d"></span>与「涌现检测器」的对照</div>` +
      `<div class="card-b" style="display:flex;flex-direction:column">` +
      `<div class="cmp-row"><div class="k">问的问题</div><div class="v">v1 只问<b>表征是否可得</b>；这里把它拆成<b>三问</b>，并说明三者何时分岔</div></div>` +
      `<div class="cmp-row"><div class="k">观测接口</div><div class="v">v1 被动看曲线；这里用<b>受保护切口</b>做一次干预替换，把不可识别问题变成有限统计实验</div></div>` +
      `<div class="cmp-row"><div class="k">读数</div><div class="v">v1 给一个 onset 分数；这里给<b>带误差保证的区间</b>与<b>可认证地平线</b></div></div>` +
      `<div class="cmp-row"><div class="k">代价</div><div class="v bad">v1 不说代价；这里说清楚：证据 <b>Θ(ρ<sup>−2ℓ</sup>)</b>，写入 <b>c</b> bit/次，扰动地板 <b>2ℓξ</b></div></div>` +
      `<div class="cmp-row"><div class="k">不声称</div><div class="v">不证明无害、不证明合规、不覆盖受测状态模型之外的情形</div></div>` +
      `</div>`;
    R.appendChild(cc);

    /* 把「怎么自己验一遍」写成可执行的三步，比再放一张图有用 */
    const gc = el("div", "card col");
    gc.style.flex = "1";
    gc.innerHTML =
      `<div class="card-h"><span class="d"></span>自己验一遍<span class="r">三步</span></div>` +
      `<div class="card-b" style="display:flex;flex-direction:column;gap:9px;justify-content:center">` +
      [
        ["01", "把切口拉长", "在 <b>03 受保护切口</b>里把 ℓ 从 6 拖到 20：r 掉到 1e−2 以下，N* 涨到 1e10 量级。同一套公式，代价自己跳出来。"],
        ["02", "把预算掐断", "在 <b>05 写入预算</b>里把 W 调到 c−1：审计次数 M 归零。定理 4 的悬崖是<b>硬的</b>，不是渐近的。"],
        ["03", "把假设踩破", "在 <b>08 边界</b>里把 ξ 调到 0.05：2ℓξ 吞掉 ρ<sup>ℓ</sup>，命题 12 的地板显形 —— 此时任何读数都不该被相信。"]
      ].map(([n, t, b]) =>
        `<div class="step"><div class="sn">${n}</div><div><div class="st">${t}</div><div class="sb">${b}</div></div></div>`
      ).join("") +
      `</div>`;
    R.appendChild(gc);

    const xc = el("div", "card col");
    xc.style.flex = "none";
    xc.innerHTML =
      `<div class="card-h"><span class="d"></span>导出</div>` +
      `<div class="card-b" style="display:flex;flex-wrap:wrap;gap:6px">` +
      `<button class="tbtn" data-ex="csv">主曲线 CSV</button>` +
      `<button class="tbtn" data-ex="json">参数 + 派生量 JSON</button>` +
      `<button class="tbtn" data-ex="cert">证书文本</button>` +
      `</div>`;
    $$("[data-ex]", xc).forEach(b => b.addEventListener("click", () => doExport(b.dataset.ex)));
    R.appendChild(xc);

    root.appendChild(R);
    return { root };
  }

  /* ==========================================================================

     ========================================================================== */
  const BUILD = {
    overview: modOverview, three: modThree, cut: modCut, evidence: modEvidence,
    budget: modBudget, clocks: modClocks, console: modConsole,
    limits: modLimits, repro: modRepro

  function metaTags(id, d, p) {
    const H = horizon(p, d);
    const T = {
      overview: [["gold", "27 页 · 5 定理 · 4 命题"], ["cy", "零数据集"], ["em", "全部实时计算"]],
      three: [["gold", "命题 9 · 10"], ["cy", "I = 1 bit"], ["ro", "误差恰 1/2"]],
      cut: [["gold", "定理 2"], ["cy", "r = " + F.fmtNum(d.r, 4)], ["vi", "K = " + p.K]],
      evidence: [["gold", "定理 3"], ["am", "N* = " + F.fmtInt(d.ns)], ["cy", "Θ(ρ⁻²ℓ) = " + F.fmtNum(Math.pow(p.rho, -2 * p.l), 3)]],
      budget: [["gold", "定理 4"], ["cy", "M = " + F.fmtInt(d.M)], ["ro", "c = " + d.c]],
      clocks: [["gold", "定理 5 · 推论 6"], ["am", "t_det = " + F.fmtNum(d.tdet, 1)], ["cy", "t_acc = " + F.fmtNum(d.tacc, 1)]],
      console: [["gold", "定理 2·3·4·7"], ["cy", "ℓ* = " + H.all], ["am", "三张证书"]],
      limits: [["gold", "命题 12·13·14"], ["ro", "地板 2ℓξ = " + F.fmtNum(F.floorBound(p.l, p.xi), 3)]],
      repro: [["gold", "Table 1"], ["em", "实时重算"]]
    };
    return (T[id] || []).map(([c, t]) => `<span class="tag ${c}">${t}</span>`).join("");
  }

  let navTok = 0, pending = false;

  function paintHeader() {
    const m = MODS[idxOf(CUR)];
    $("#crumbN").textContent = m.n;
    $("#crumbT").textContent = m.name;
    $("#cKick").textContent = m.kick;
    $("#cTitle").textContent = m.name;
    $("#cMeta").innerHTML = metaTags(CUR, D, P);
  }

  function renderCanvas() {
    const body = $("#cBody");
    body.innerHTML = "";
    const built = BUILD[CUR](D, P);
    const root = built.root || built;
    body.appendChild(root);
    if (built.draw) built.draw();
  }

  function paintRail() {
    $$(".rail-item").forEach(n => n.classList.toggle("on", n.dataset.id === CUR));
  }

  function go(id, opt) {
    if (!BUILD[id]) return;
    const same = id === CUR;
    CUR = id;
    paintRail();
    const item = $('.rail-item[data-id="' + id + '"]');
    if (item) { item.classList.remove("flash"); void item.offsetWidth; item.classList.add("flash"); }
    paintHeader();
    renderInspector();
    writeHash();
    if (same && opt && opt.instant) { renderCanvas(); return; }
    const body = $("#cBody");
    if (G.staticMode || G.reduce) { renderCanvas(); return; }
    const tok = ++navTok;
    body.classList.add("swap-out");
    setTimeout(() => {
      if (tok !== navTok) return;
      renderCanvas();
      body.classList.remove("swap-out");
    }, 120);
  }

  /* ---------- rail ---------- */
  function buildRail() {
    const r = $("#rail");
    r.innerHTML = "";
    const head = el("div", "rail-head", "模块 · MODULES");
    r.appendChild(head);
    MODS.forEach(m => {
      const n = el("div", "rail-item");
      n.dataset.id = m.id;
      n.dataset.short = m.short;
      n.innerHTML =
        `<div class="rail-n">${m.n}</div>` +
        `<div class="rail-body"><div class="rail-name">${m.name}</div><div class="rail-thm">${m.thm}</div></div>`;
      n.addEventListener("click", () => go(m.id));
      r.appendChild(n);
    });
    const foot = el("div", "rail-foot");
    foot.innerHTML =
      `<div class="rail-kv"><span>版本</span><b>v3 · workbench</b></div>` +
      `<div class="rail-kv"><span>内核</span><b>定理表达式</b></div>`;
    r.appendChild(foot);
  }

    ["ρ^ℓ", "r", "cy", v => F.fmtNum(v, 4), "cut"],
    ["N", "N", "", v => F.fmtInt(v), "evidence"],
    ["N*", "ns", "", v => F.fmtInt(v), "evidence"],
    ["M", "M", "", v => F.fmtInt(v), "budget"],
    ["e*", "eB", "", v => F.fmtNum(v, 4), "budget"],
    ["t_det", "tdet", "", v => F.fmtNum(v, 1), "clocks"],
    ["t_acc", "tacc", "cy", v => F.fmtNum(v, 1), "clocks"],
    ["t_tr", "ttr", "vi", v => F.fmtNum(v, 1), "clocks"],

  function buildDock() {
    const dk = $("#dock");
    dk.innerHTML = "";
    DOCK.forEach(([k, id, cls, fmt, link]) => {
      const c = el("div", "dock-cell");
      c.innerHTML = `<div class="dock-k">${k}</div><div class="dock-v ${cls}" id="dk-${id}">—</div>`;
      c.style.cursor = "pointer";
      c.title = "跳到 " + (MODS.find(m => m.id === link) || {}).name;
      c.addEventListener("click", () => go(link));
      dk.appendChild(c);
    });
    dk.appendChild(el("div", "dock-sp"));
    const st = el("div", "dock-status");
    st.innerHTML =
      `<div class="dock-dots"><i class="dock-dot" id="dd-ev"></i><i class="dock-dot" id="dd-bd"></i><i class="dock-dot" id="dd-lc"></i></div>` +
      `<div class="dock-stxt" id="dockTxt">证据 · 写入 · 重置</div>`;
    dk.appendChild(st);
  }

  function updateDock() {
    DOCK.forEach(([k, id, cls, fmt]) => {
      const node = $("#dk-" + id);
      if (!node) return;
      let v = D[id];
      if (id === "hor") v = horizon(P, D).all;
      G.tick(node, v, fmt);
    });
    $("#dd-ev").className = "dock-dot " + D.sEv;
    $("#dd-bd").className = "dock-dot " + D.sBd;
    $("#dd-lc").className = "dock-dot " + D.sLc;
    const t = $("#dockTxt");
    if (S.pin) {
      const dr = (D.r - S.pin.r) / (S.pin.r || 1);
      t.textContent = `相对钉住  r ${dr >= 0 ? "+" : ""}${(dr * 100).toFixed(1)}%`;
    } else {
      t.textContent = "证据 · 写入 · 重置";
    }
  }

  /* ---------- inspector ---------- */
  function sliderNode(k) {
    const df = PARAMS[k];
    const w = el("div", "sl");
    w.dataset.key = k;
    w.innerHTML =
      `<div class="sl-top"><span class="sl-lab">${df.lab}</span><span class="sl-val"></span></div>` +
      `<input type="range" min="${df.min}" max="${df.max}" step="${df.step}" value="${P[k]}">`;
    const inp = $("input", w), out = $(".sl-val", w);
    const paint = () => {
      const v = +inp.value;
      inp.style.setProperty("--p", ((v - inp.min) / (inp.max - inp.min) * 100).toFixed(2) + "%");
      out.textContent = df.fmt(v);
    };
    paint();
    inp.addEventListener("input", () => {
      P[k] = +inp.value;
      paint();
      bump();
    });
    return w;
  }

  function renderInspector() {
    const m = MODS[idxOf(CUR)];
    paintInspector($("#insp"), m);
    paintInspector($("#dBody"), m);
    paintFab();
  }

  /* #insp 与窄屏抽屉共用同一份结构：参数顺序、动作、读数完全一致 */
  function paintInspector(box, m) {
    if (!box) return;
    box.innerHTML = "";

    const keys = CTX[CUR] || [];
    if (keys.length) {
      const sec = el("div", "insp-sec");
      sec.innerHTML = `<div class="insp-h">本模块参数<span class="r">${m.thm}</span></div>`;
      keys.forEach(k => sec.appendChild(sliderNode(k)));
      box.appendChild(sec);
    }

    const sec2 = el("div", "insp-sec");
    sec2.innerHTML = `<div class="insp-h">其余参数<span class="r">全局共享</span></div>`;
    Object.keys(PARAMS).filter(k => keys.indexOf(k) < 0).forEach(k => sec2.appendChild(sliderNode(k)));
    box.appendChild(sec2);

    const sec3 = el("div", "insp-sec");
    sec3.innerHTML = `<div class="insp-h">动作</div>`;
    const row = el("div", "row");
    row.style.cssText = "flex-wrap:wrap;gap:6px";
    [
      ["重置", "R", resetAll],
      ["扫描", "S", openSweep],
      ["钉住", "P", togglePin],
      ["分享", "L", doShare],
      ["引导", "T", () => startTour()],
      ["键盘", "?", () => openOverlay("keys")]
    ].forEach(([lab, kk, fn]) => {
      const b = el("button", "tbtn", `${lab}<span class="kk">${kk}</span>`);
      b.addEventListener("click", fn);
      row.appendChild(b);
    });
    sec3.appendChild(row);

    const sec4 = el("div", "insp-sec");
    sec4.innerHTML = `<div class="insp-h">本模块读数<span class="r">实时</span></div>` +
      `<div>${readRows(inspectorReads())}</div>`;
    box.appendChild(sec3);
    box.appendChild(sec4);
  }

  /* 顶栏悬浮按钮上的徽标：当前偏离论文默认值的参数个数 */
  function paintFab() {
    const n = $("#fabN");
    if (!n) return;
    const k = Object.keys(DEF).filter(x => Math.abs(P[x] - DEF[x]) > 1e-9).length;
    n.textContent = String(k);
    n.style.color = k ? "var(--amber)" : "var(--cyan)";
    n.style.background = k ? "rgba(255,199,107,.14)" : "rgba(94,231,255,.13)";

  function openDrawer(on) {
    const d = $("#drawer"), s = $("#dScrim");
    if (!d) return;
    d.classList.toggle("on", on);
    if (s) s.classList.toggle("on", on);
    if (on) { const b = $("#dBody"); if (b) b.scrollTop = 0; }
  }

  function inspectorReads() {
    const H = horizon(P, D);
    const base = [
      ["r = ρ^ℓ", F.fmtNum(D.r, 5), "cy"],
      ["N*", F.fmtInt(D.ns), D.sEv === "ok" ? "em" : D.sEv === "thin" ? "am" : "ro"],
      ["e*", F.fmtNum(D.eB, 4), D.sBd === "ok" ? "em" : D.sBd === "thin" ? "am" : "ro"],
      ["ℓ* 联合", String(H.all), "am"]
    ];
    if (CUR === "clocks" || CUR === "console") {
      base.push(["t_det", F.fmtNum(D.tdet, 2), ""], ["t_acc", F.fmtNum(D.tacc, 2), "cy"]);
    }
    if (CUR === "limits") base.push(["地板 2ℓξ", F.fmtNum(F.floorBound(P.l, P.xi), 4), "ro"]);
    if (CUR === "budget") base.push(["M", F.fmtInt(D.M), "cy"], ["c", String(D.c), ""]);
    return base;
  }

  /* ---------- 变更传播 ---------- */
  function bump() {
    D = F.derive(P);
    paintHeader();
    updateDock();
    paintFab();
    const html = readRows(inspectorReads());
    $$("#insp .insp-sec:last-child > div, #dBody .insp-sec:last-child > div")
      .forEach(n => { n.innerHTML = html; });
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const body = $("#cBody");
      body.innerHTML = "";
      const built = BUILD[CUR](D, P);
      body.appendChild(built.root || built);
      if (built.draw) built.draw();
    });
  }

  function resetAll() {
    P = Object.assign({}, DEF);
    S.flips = [];
    hardRefresh();
    toast("已重置为论文默认参数", "ok");
  }
  function hardRefresh() {
    D = F.derive(P);
    paintHeader();
    renderInspector();
    renderCanvas();
    updateDock();
    writeHash();
  }

  /* ---------- 命令面板 ---------- */
  let palSel = 0, palItems = [];

  function palSource() {
    const out = [];
    MODS.forEach(m => out.push({
      kind: "模块", n: m.n, t: m.name, h: m.thm, key: m.id + " " + m.name + " " + m.thm,

    }));

    }));
    [
      ["扫描可认证地平线", "S", openSweep, "sweep horizon 扫描 地平线"],

    ].forEach(([t, h, fn, key]) => out.push({ kind: "动作", n: "·", t, h, key, run: fn }));
    return out;

  function palRender(q) {
    const list = $("#palList");
    const all = palSource();
    const ql = q.trim().toLowerCase();
    palItems = !ql ? all : all.filter(x => x.key.toLowerCase().indexOf(ql) >= 0 ||
      x.t.toLowerCase().indexOf(ql) >= 0);
    if (!palItems.length) {
      list.innerHTML = `<div class="pal-empty">没有匹配项</div>`;
      return;
    }
    palSel = Math.min(palSel, palItems.length - 1);
    let html = "", lastKind = "";
    palItems.forEach((x, i) => {
      if (x.kind !== lastKind) { html += `<div class="pal-sec">${x.kind}</div>`; lastKind = x.kind; }
      html += `<div class="pal-item ${i === palSel ? "sel" : ""}" data-i="${i}">` +
        `<span class="n">${x.n}</span><span class="t">${x.t}</span>` +
        (x.h ? `<span class="h">${x.h}</span>` : "") + `</div>`;
    });
    list.innerHTML = html;
    $$(".pal-item", list).forEach(n => {
      n.addEventListener("click", () => {
        const it = palItems[+n.dataset.i];
        closeAll();
        if (it) it.run();
      });
    });
  }

  /* ---------- 扫描 ---------- */
  function buildSweepOverlay() {
    const o = el("div", "ovl");
    o.id = "ovlSweep";
    o.innerHTML =
      `<div class="ovl-mask" data-close="sweep"></div>
       <div class="sheet" style="width:min(580px,93vw)">
         <h3>可认证地平线扫描</h3>
         <div id="sweepBody"></div>
         <div style="display:flex;gap:8px;margin-top:16px;align-items:center">
           <span style="font-family:var(--f-mono);font-size:9.5px;color:var(--faint);flex:1" id="sweepNote"></span>

         </div>

  function openSweep() {
    const o = $("#ovlSweep") || buildSweepOverlay();
    const H = horizon(P, D);
    const cap = Math.max(24, Math.round(Math.max(H.ev, H.bd, H.fl, H.all, 1) * 1.22));
    const rows = [
      ["证据", H.ev, "var(--cyan)", "N* ≤ N"],
      ["写入", H.bd, "var(--amber)", "e* ≤ δ"],
      ["扰动地板", H.fl, "var(--rose)", "ρ^ℓ > 2ℓξ"]
    ];
    const body = $("#sweepBody", o);
    body.innerHTML =
      `<div style="font-size:11.5px;line-height:1.7;color:var(--dim);margin-bottom:12px">` +
      `固定其余参数，逐项二分出每个判据<b style="color:var(--ink-2)">仍然成立</b>的最大切口长度 ℓ。` +
      `三个地平线取最小值，就是这套参数下能同时说三句话的最长切口。</div>` +
      rows.map(([k, v, c, cond]) =>
        `<div class="hbar"><div class="hk">${k}<br><span style="color:var(--faint);font-size:8px">${cond}</span></div>` +
        `<div class="track"><div class="fill" style="width:${(v / cap * 100).toFixed(1)}%;background:${c}"></div></div>` +
        `<div class="hv" style="color:${c}">${v}${v >= cap ? "+" : ""}</div></div>`
      ).join("") +
      `<div class="hbar" style="border-top:1px solid var(--line-2);margin-top:6px;padding-top:11px">` +
      `<div class="hk" style="color:var(--ink)">联合 ℓ*</div>` +
      `<div class="track"><div class="fill" style="width:${(H.all / cap * 100).toFixed(1)}%;background:var(--emerald)"></div></div>` +
      `<div class="hv" style="color:var(--emerald)">${H.all}${H.all >= cap ? "+" : ""}</div></div>`;

    const bind = H.all === H.ev ? "证据" : H.all === H.bd ? "写入" : "扰动地板";
    $("#sweepNote", o).textContent =
      `当前 ℓ = ${P.l}${P.l > H.all ? "，已超出联合地平线" : "，在联合地平线之内"} · 瓶颈：${bind}`;
    openOverlay("sweep");
  }

  /* ---------- 键盘表 ---------- */
  /* ---------- 引导 ---------- */
  const TOUR = [
    { sel: "#rail", t: "九个模块", b: "左栏是论文的九个切面。数字键 1–9 直接跳转，[ ] 前后翻。切换时参数不丢。" },
    { sel: "#canvas", t: "中央画布", b: "每个模块一张画布，不做长滚动。所有图都是实时算的，不是截图。" },
    { sel: "#insp", t: "参数面板", b: "顶部是这个模块最相关的参数，下面是全部十项。拖动任意一项，画布与底栏同时变。" },
    { sel: "#dock", t: "常驻读数", b: "九项派生量与三个状态灯常驻底部。无论你在哪个模块，都能看到全局是否还成立。" },
    { sel: "#btnPreset", t: "预设场景", b: "五个预设直接把你带到失效边界：长切口、预算枯竭、强扰动、大规模。" },
    { sel: "#btnPal", t: "命令面板", b: "⌘K / Ctrl K 搜模块、预设和动作。这是最快的使用方式。" }
  ];
  let tourI = -1;

  function startTour() {
    closeAll();
    $("#ovlTour").classList.add("on");
    tourI = -1;
    tourNext();
  }
  function stopTour() {
    tourI = -1;
  }
  function tourNext() {
    if (tourI >= TOUR.length - 1) { closeAll(); return; }
    tourI++;
    tourPaint();
  }
  function tourPrev() {
    if (tourI <= 0) return;
    tourI--;
    tourPaint();
  }
  function tourPaint() {
    const st = TOUR[tourI];
    if (!st) return;
    const el2 = $(st.sel);
    if (!el2) return;
    const r = el2.getBoundingClientRect();
    const pad = 6;
    const spot = $("#tourSpot");
    spot.style.left = (r.left - pad) + "px";
    spot.style.top = (r.top - pad) + "px";
    spot.style.width = (r.width + pad * 2) + "px";
    spot.style.height = (r.height + pad * 2) + "px";

    const tip = $("#tourTip");
    const tw = 300, th = 170;
    let x, y;
    if (r.right + 16 + tw < innerWidth) { x = r.right + 16; y = r.top; }
    else if (r.left - 16 - tw > 0) { x = r.left - 16 - tw; y = r.top; }
    else { x = Math.min(innerWidth - tw - 16, Math.max(16, r.left)); y = Math.min(innerHeight - th - 16, r.bottom + 14); }
    y = Math.max(14, Math.min(innerHeight - th - 14, y));
    tip.style.left = x + "px";
    tip.style.top = y + "px";
    tip.style.right = "auto";

    $("#tourStep").textContent = `STEP ${tourI + 1} / ${TOUR.length}`;
    $("#tourT").textContent = st.t;
    $("#tourB").textContent = st.b;
    $("#tourNext").textContent = tourI === TOUR.length - 1 ? "完成" : "下一步";
    $("#tourPrev").style.visibility = tourI === 0 ? "hidden" : "visible";
  }

  /* ==========================================================================
     17 · 动作：钉住 / 分享 / 导出

  function togglePin() {
    if (S.pin) {
      S.pin = null;
      $("#btnPin").classList.remove("on");
      toast("已取消钉住", "ok");
    } else {
      S.pin = { r: D.r, eB: D.eB, ns: D.ns, P: Object.assign({}, P) };
      $("#btnPin").classList.add("on");
      toast("已钉住当前参数，底栏显示相对变化", "ok");
    }
    updateDock();
  }

  function paramStr() {
    return Object.keys(PARAMS).map(k => k + "=" + P[k]).join("&");
  }
  function writeHash() {
    const h = "#" + CUR + "&" + paramStr();
    try { history.replaceState(null, "", h); } catch (e) { }
  }
  function readHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!h) return;
    const [id, qs] = h.split("&");
    if (BUILD[id]) CUR = id;
    if (qs || h.indexOf("=") > 0) {
      const src = qs ? h.slice(id.length + 1) : h;
      src.split("&").forEach(kv => {
        const [k, v] = kv.split("=");
        if (PARAMS[k] && v !== undefined && isFinite(+v)) P[k] = +v;
      });
    }
  }

  function doShare() {
    writeHash();
    const url = location.href;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(
        () => toast("链接已复制 —— 参数与模块都在里面", "ok"),
        () => toast("复制失败，地址栏已是可分享链接", "warn")
      );
    } else {
      toast("地址栏已是可分享链接", "ok");
    }
  }

  function download(name, text, mime) {
    const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  function doExport(kind) {
    const ep = $("#exportPop");
    if (ep) ep.classList.remove("on");
    if (kind === "cert") {
      const txt = certText(D, P);
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("证书已复制", "ok"), () => download("certificate.txt", txt));
      else download("certificate.txt", txt);
      return;
    }
    if (kind === "json") {
      const H = horizon(P, D);
      const obj = {
        paper: "The Certification Horizon of Learned Computation",
        params: P, derived: D, horizon: H,
        checks: { thm2Residual: F.verifyTheorem2(P.rho, P.K, 1, Math.min(P.l, 24)) },
        generated: new Date().toISOString()
      };
      download("horizon.json", JSON.stringify(obj, null, 2), "application/json");
      toast("已导出 JSON", "ok");
      return;
    }
    const rows = [["l", "rho^l", "N_star", "2*l*xi", "e_star_audit"]];
    for (let l = 1; l <= 60; l++) {
      const r = Math.pow(P.rho, l);
      const c = F.CK(r, P.K);

  }
  function moveCard(x, y) { card.style.left = x + "px"; card.style.top = y + "px"; }

  function placeCard(r, pref) {
    var cw = card.offsetWidth, ch = card.offsetHeight,
        gap = 14, M = 12, vw = innerWidth, vh = innerHeight;
    function fits(x, y) { return x >= M && y >= M && x + cw <= vw - M && y + ch <= vh - M; }
    var order = pref ? [pref, "right", "left", "bottom", "top"] : ["right", "left", "bottom", "top"];
    var done = {};
    for (var k = 0; k < order.length; k++) {
      var p = order[k]; if (done[p]) continue; done[p] = 1;
      var x, y;
      if (p === "right") { x = r.right + gap; y = r.top; }
      else if (p === "left") { x = r.left - gap - cw; y = r.top; }
      else if (p === "bottom") { x = r.left; y = r.bottom + gap; }
      else { x = r.left; y = r.top - gap - ch; }
      if (fits(x, y)) { moveCard(x, y); return; }
    }
    /* 都放不下（内嵌小卡片里常见）：贴底居中，允许压住目标 */
    moveCard(Math.max(M, Math.min(vw - cw - M, r.left)), Math.max(M, vh - ch - M));
  }

  function paint() {
    var st = steps[i]; if (!st) return;
    elT.innerHTML = st.t || "";
    elB.innerHTML = st.b || "";
    elStep.textContent = ("0" + (i + 1)).slice(-2) + " / " + ("0" + steps.length).slice(-2);
    elFill.style.width = ((i + 1) / steps.length * 100) + "%";
    elPrev.disabled = i === 0;
    elNext.textContent = i === steps.length - 1 ? "开始动手 ✓" : "下一步 →";

    var t = st.sel ? document.querySelector(st.sel) : null;
    if (!vis(t)) t = null;

    if (!t) {
      /* 没有目标（开场白）：在正中留一个极小的孔，整屏压暗 */
      moveSpot(innerWidth / 2 - 1, innerHeight / 2 - 1, 2, 2);
      moveCard(Math.max(12, (innerWidth - card.offsetWidth) / 2),
               Math.max(12, (innerHeight - card.offsetHeight) / 2));
      return;
    }
    var r = t.getBoundingClientRect(), pad = 6;
    moveSpot(r.left - pad, r.top - pad, r.width + pad * 2, r.height + pad * 2);
    placeCard(r, st.pos);
  }

  /* 目标可能在未激活的章节里（v1 是章节切换式，其余章节 display:none）：
     借 vendor-shell 的章节栏把它翻出来，否则聚光灯只能退化成居中 */
  function revealTarget(sel) {
    var t = document.querySelector(sel);
    if (!t || vis(t)) return t;
    var sec = t.closest ? t.closest("section") : null;
    if (sec && sec.parentElement) {
      var sibs = [].slice.call(sec.parentElement.children).filter(function (e) {
        return e.tagName === "SECTION";
      });
      var idx = sibs.indexOf(sec);
      var bar = document.getElementById("vshBar");
      if (idx >= 0 && bar) {
        var btns = bar.querySelectorAll("button");
        if (btns[idx]) {
          btns[idx].click();
          return document.querySelector(sel);
        }
      }
    }
    return t;
  }

  /* 目标可能被祖先的 overflow 裁掉（v1 的章节是个 overflow-y:auto 的固定视口，
     控件常在折叠线以下）。注意不能只跟视口比：元素矩形可能落在视口内、却在容器外 */
  function scrollerOf(el) {
    var cur = el.parentElement;
    while (cur && cur !== document.body) {
      var cs = getComputedStyle(cur);
      if (/(auto|scroll)/.test(cs.overflowY) && cur.scrollHeight > cur.clientHeight + 2) return cur;
      cur = cur.parentElement;
    }
    return null;
  }
  function ensureVisible(el) {
    var sc = scrollerOf(el);
    if (!sc) return false;
    var r = el.getBoundingClientRect(), cr = sc.getBoundingClientRect(), m = 28;
    if (r.top >= cr.top + m && r.bottom <= cr.bottom - m) return false;
    /* 直接改 scrollTop（非平滑）：位置立刻确定，避免聚光灯追着动画跑偏 */
    sc.scrollTop += (r.top + r.height / 2) - (cr.top + cr.height / 2);
    return true;
  }

  /* 目标可能在可滚动容器里：先滚到可见，再定位 */
  function goto(k) {
    i = k;
    var st = steps[i]; if (!st) return;
    var t = st.sel ? document.querySelector(st.sel) : null;
    if (t && !vis(t)) t = revealTarget(st.sel);
    if (vis(t)) ensureVisible(t);
    paint();
  }

  function show(k) {
    open = true;
    fab.classList.add("hide");
    root.style.display = "block";
    /* 先量一次高度，再开 opacity，避免首帧卡片位置跳动 */
    paint();
    requestAnimationFrame(function () { root.classList.add("on"); });
    goto(k);
  }
  function hide() {
    open = false;
    root.classList.remove("on");
    setTimeout(function () { if (!open) root.style.display = "none"; }, 260);
    fab.classList.remove("hide");
  }
  function finish() {
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
    hide();
  }

  elNext.addEventListener("click", function () {
    if (i >= steps.length - 1) { finish(); return; }
    goto(i + 1);
  });
  elPrev.addEventListener("click", function () { if (i > 0) goto(i - 1); });
  elSkip.addEventListener("click", finish);
  fab.addEventListener("click", function () { if (!open) show(0); });

  /* 引导开着时接管方向键与 Esc；开着期间不让底层实验室的快捷键抢走 */
  addEventListener("keydown", function (e) {
    if (!open) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation(); if (i < steps.length - 1) goto(i + 1); else finish(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); e.stopPropagation(); if (i > 0) goto(i - 1); }
  }, true);

  /* 视口变化 / 容器滚动时重定位 */
  function reflow() {
    if (!open) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(paint);
  }
  addEventListener("resize", reflow);
  addEventListener("scroll", reflow, true);

  root.style.display = "none";
  if (!seen) setTimeout(function () { show(0); }, 620);
})();
</script>
</body>
</html>
