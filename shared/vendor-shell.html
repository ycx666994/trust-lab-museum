<!-- tl-vendor-shell v1：把长滚动收编页改造成「章节场景切换」固定视口（由 build.sh 注入 body 结束标签前） -->
<style>
html,body{height:100%!important;overflow:hidden!important}
body{display:flex!important;flex-direction:column!important}
body>.page{flex:1 1 auto!important;min-height:0!important;display:flex!important;flex-direction:column!important;width:100%!important;max-width:none!important;padding:0!important;margin:0!important}
.vsh-root{flex:1 1 auto!important;min-height:0!important;display:flex!important;flex-direction:column!important;width:100%!important;max-width:none!important;padding:0!important;margin:0!important}
.vsh-root>*{display:none!important}
.vsh-root>header,.vsh-root>nav{display:none!important}
.vsh-root>section.on{display:block!important;flex:1 1 auto!important;min-height:0!important;max-height:none!important;overflow-y:auto!important;overscroll-behavior:contain}
.vsh-root>section.on::-webkit-scrollbar{width:9px}
.vsh-root>section.on::-webkit-scrollbar-thumb{background:rgba(87,199,255,.4);border-radius:5px}
.vsh-root>section.on::-webkit-scrollbar-track{background:transparent}
.vsh-bar{flex:none;z-index:99990;display:flex;align-items:center;gap:5px;padding:8px 12px;background:rgba(8,11,16,.93);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);overflow-x:auto}
.vsh-bar b{font-size:12px;color:#57c7ff;margin-right:8px;letter-spacing:1px;white-space:nowrap}
.vsh-bar button{cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#8b98a9;border-radius:8px;padding:5px 11px;font-size:11.5px;font-family:inherit;transition:all .15s;white-space:nowrap;flex:none}
.vsh-bar button:hover{color:#dde5ee;border-color:rgba(255,255,255,.25)}
.vsh-bar button.on{color:#57c7ff;border-color:rgba(87,199,255,.5);background:rgba(87,199,255,.1)}
</style>
<div class="vsh-bar" id="vshBar"><b>◆ 章节</b><span style="flex:1"></span><span style="font-size:10px;color:#5b6878;font-family:Consolas,monospace">← → 切章</span></div>
<script>
(function () {
  "use strict";
  var NAMES = { hero: "开场", problem: "问题", lab: "实验室", validate: "验证", gallery: "画廊", defs: "定义", methods: "方法", closing: "结语" };
  var page = document.querySelector("body>.page");
  if (!page) return;
  /* v1 的章节在 MAIN.top 里；通用兜底：找第一个包含 section 的 main/.page 本身 */
  var main = page.querySelector("main") || page;
  main.classList.add("vsh-root");
  var secs = [...main.children].filter(el => /^SECTION$/.test(el.tagName));
  if (!secs.length) return;
  var bar = document.getElementById("vshBar");
  var btns = secs.map((s, i) => {
    var name = NAMES[s.id] || NAMES[s.classList[0]] || (s.querySelector(".sec-title") ? s.querySelector(".sec-title").textContent.trim().slice(0, 6) : "章节 " + (i + 1));
    var b = document.createElement("button");
    b.textContent = name;
    b.addEventListener("click", () => go(i));
    bar.appendChild(b);
    return b;
  });
  // 章节 -> hash 名（优先 id，其次首个 class）：支持 #lab/#problem 等深链直达
  var keyOf = s => (s.id || (s.classList[0] || "")).toLowerCase();
  var indexByKey = {};
  secs.forEach((s, i) => { var k = keyOf(s); if (k) indexByKey[k] = i; });
  var cur = 0;
  function syncHash() {
    try { history.replaceState(null, "", "#" + keyOf(secs[cur])); } catch (e) {}
  }
  function go(i, skipHash) {
    cur = (i + secs.length) % secs.length;
    secs.forEach((s, k) => s.classList.toggle("on", k === cur));
    btns.forEach((b, k) => b.classList.toggle("on", k === cur));
    secs[cur].scrollTop = 0;
    if (!skipHash) syncHash();
  }
  function goByHash() {
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h && indexByKey[h] !== undefined) go(indexByKey[h], true);
    else go(0, true);
  }
  addEventListener("keydown", e => {
    var t = (document.activeElement || {}).tagName;
    if (t === "INPUT" || t === "TEXTAREA") return;
    if (e.key === "ArrowRight") go(cur + 1);
    else if (e.key === "ArrowLeft") go(cur - 1);
  });
  addEventListener("hashchange", goByHash);
  goByHash();   // 初始：命中 #lab 等深链则直达，否则开场
})();
</script>
